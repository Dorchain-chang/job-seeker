name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库第一次跑部署时 Pages 还没被启用，configure-pages 会调
          # GET /repos/{owner}/{repo}/pages 拿到 404 然后直接失败。
          # enablement: true 让它顺手把 Pages 打开（build_type=workflow）。
          enablement: true

      # 站点根 = 公开版（dist/public）：它是唯一对外交付的形态，只内嵌岗位快照，
      # 不含作者任何投递 / 实习 / 收件箱数据，访客首次打开自选「用内置快照」或
      # 「从空白开始」，个人数据一律留在访客本机。
      # 演示版（localStorage mock 数据）保留在 /demo/ 子路径。
      # 不要把整个仓库当站点根上传，否则 .github、src/ 都会被公网访问到。
      - name: Build site into _site
        run: |
          set -e
          rm -rf _site && mkdir -p _site/demo
          cp dist/public/index.html _site/index.html
          cp dist/demo/index.html   _site/demo/index.html
          cp README.md _site/README.md
          touch _site/.nojekyll
          ls -R _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
