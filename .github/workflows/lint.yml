name: Lint (sanity check)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 坑：不要把多行 python / JS 代码直接写进 `run: |` 块标量里 —— 顶格的代码
      # 行会被 YAML 当成块外内容，整个 workflow 直接解析失败（GitHub 的表现是
      # 0 个 job、不到 1 秒就挂的红色运行，没有日志）。多行脚本请放到 tests/ 下。

      - name: Check workflow YAML parses
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml || true
          python3 tests/check_workflows.py

      - name: Check inline JS syntax
        run: python3 tests/check_inline_js.py

      # 坑：build_pages.py 的 JS 是普通（非 raw）三引号串，JS 里写 \u0000 / \x1f / \b 之类
      # 会被 Python 先解析成真实控制字符写进 HTML，HTML 解析再换成 U+FFFD，正则直接
      # 「Range out of order」整页脚本失效——而 node --check 查不出来（文件里是合法字节）。
      # 这一步专门拦这一类，见 tests/check_escapes.py 顶部说明。
      - name: Guard against Python-ate JS escapes / raw control chars
        run: python3 tests/check_escapes.py

      # 构建链与数据管道全是 Python：任何语法错误都会让整条链路静默失效。
      # （真实事故：sync_autumn_all.py 缺 import os，加载即 NameError，脚本完全跑不起来）
      - name: Check Python sources compile
        run: |
          set -e
          python3 -m py_compile src/*.py scripts/*.py
          echo "OK  src/ 与 scripts/ 下全部 Python 源文件语法通过"

      - name: Verify demo stays self-contained
        run: |
          for f in dist/demo/*.html; do
            if ! grep -q "DEMO MODE ADAPTER" "$f"; then
              echo "FAIL $f 缺少 demo 适配层"
              exit 1
            fi
          done
          # demo 是纯静态站，导航不能指向生产环境（资料库）节点，否则一点就跳走
          if grep -q "workbuddy.cn/space/d/" dist/demo/*.html; then
            echo "FAIL demo 里残留了生产环境链接"
            grep -n "workbuddy.cn/space/d/" dist/demo/*.html || true
            exit 1
          fi
          # 生产页反过来必须保留真实的资料库 databaseId 字面量
          if ! grep -q "GgZ71tywhs4HEZytFSqXTP" "dist/00-总览台.html"; then
            echo "FAIL 生产页丢失了 databaseId 字面量"
            exit 1
          fi
          echo "OK  demo 自包含 / 生产页 databaseId 完整"

      - name: Verify merged app markers
        run: |
          # dist/00-总览台.html 是 build_single.py 产出的合并版单文件应用
          if ! grep -q 'data-view="soe"' "dist/00-总览台.html"; then
            echo "FAIL dist/00-总览台.html 不是合并版（缺少 data-view 切换）"
            exit 1
          fi
          # 合并版不应该再有任何跨节点跳转链接
          if grep -q "workbuddy.cn/space/d/" "dist/00-总览台.html"; then
            echo "FAIL dist/00-总览台.html 里还有生产环境跳转链接"
            exit 1
          fi
          echo "OK  合并版标记正确"

      # 公开版是唯一对外发布的形态，必须证明它没带上作者的隐私。
      # 注意：`apps`/`interns`/`inbox` 三个表名会合法地出现在 __SITE_SCHEMA__ 里
      # （nameOf 需要 dbid→表名 映射，apps 的「当前阶段」选项还要给访客自记投递用），
      # 所以门禁断言的是「没有隐私表的**数据行**」，而不是「没有表名字符串」。
      - name: Verify public bundle stays privacy-free
        run: |
          set -e
          f=dist/public/index.html
          if [ ! -f "$f" ]; then echo "FAIL 缺少 $f"; exit 1; fi
          # 1) 三张隐私表的真实 databaseId 一律不得出现（schema 里必须是 *_FAKE）
          for rid in oBGkMFTv9Xv4Xn5gFOK18S tgH8096uENTaIj8RSY9qm5 EdCHnKtjZIXEw37tUmvhqL; do
            if grep -q "$rid" "$f"; then
              echo "FAIL 公开版残留隐私表真实 id：$rid"
              exit 1
            fi
          done
          # 2) 硬门禁：快照对象只允许有 exportedAt 与 jobs 两个键（用 Python 解析，不看字符串）
          python3 - <<'PY'
          import io, json, sys
          t = io.open('dist/public/index.html', encoding='utf-8', errors='replace').read()
          i = t.find('__SITE_SEED__=')
          if i < 0:
            print('FAIL 公开版找不到 __SITE_SEED__'); sys.exit(1)
          seed, _ = json.JSONDecoder().raw_decode(t[i + len('__SITE_SEED__='):])
          keys = sorted(seed.keys())
          leaked = [k for k in keys if k not in ('exportedAt', 'jobs')]
          if leaked:
            print('FAIL 公开版快照里有隐私表数据行：%s' % leaked); sys.exit(1)
          n = len(seed.get('jobs') or [])
          if n < 1:
            print('FAIL 公开版岗位快照为空'); sys.exit(1)
          # 3) 岗位快照里不得混入「示例预置」演示行
          bad = []
          for r in (seed.get('jobs') or []):
            src = r.get('来源')
            if isinstance(src, dict):
              src = src.get('text')
            if src == '示例预置':
              bad.append(r)
          if bad:
            print('FAIL 公开版岗位快照残留「示例预置」行 %d 条' % len(bad)); sys.exit(1)
          print('OK  公开版快照仅含 jobs=%d 条，无隐私表数据行' % n)
          PY
          # 4) 命名空间隔离
          if grep -q 'qz_' "$f"; then
            echo "FAIL 公开版残留私有站点版的 localStorage 命名空间 qz_"
            exit 1
          fi
          if ! grep -q 'qc_' "$f"; then
            echo "FAIL 公开版未使用自己的 qc_ 命名空间"
            exit 1
          fi
          echo "OK  公开版无隐私残留（三表真实 id / 隐私表数据行 / qz_ 前缀均未出现）"

      - name: Verify generated files are up to date
        run: |
          set -e
          python3 src/build_pages.py
          python3 src/build_single.py
          python3 src/build_demo.py
          python3 src/build_site.py
          python3 src/build_public.py
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- dist; then
            echo "FAIL dist/ 与生成脚本不一致。请在本地跑："
            echo "    python3 src/build_pages.py && python3 src/build_single.py && python3 src/build_demo.py && python3 src/build_site.py && python3 src/build_public.py"
            echo "  然后 git add dist 一起提交。"
            exit 1
          fi
          echo "OK  生成产物与脚本一致"

      - name: Verify page counts
        run: |
          prod=$(ls dist/*.html 2>/dev/null | wc -l)
          demo=$(ls dist/demo/*.html 2>/dev/null | wc -l)
          site=$(ls dist/site/*.html 2>/dev/null | wc -l)
          public=$(ls dist/public/*.html 2>/dev/null | wc -l)
          if [ "$prod" -ne 4 ]; then echo "FAIL 期望 4 个生产页，实际 $prod"; exit 1; fi
          if [ "$demo" -ne 1 ]; then echo "FAIL 期望 1 个 demo 页（合并版单文件），实际 $demo"; exit 1; fi
          if [ "$site" -ne 1 ]; then echo "FAIL 期望 1 个站点页，实际 $site"; exit 1; fi
          if [ "$public" -ne 1 ]; then echo "FAIL 期望 1 个公开版页，实际 $public"; exit 1; fi
          echo "OK  $prod 个生产页 / $demo 个 demo 页 / $site 个站点页 / $public 个公开版页"

  smoke:
    # 真浏览器跑一遍：注入 mock SDK（三表岗位数据），验证初始化链路、四个视图渲染、
    # 筛选、热力图、公司情报深链、PDF/Word 简历上传，以及 db.onUpdated 外部变更自动重拉。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # dist/ 产物已入库；本地改动构建脚本后必须重新构建并提交，冒烟前也重跑一遍构建
      - name: Build pages
        run: |
          python3 src/build_pages.py
          python3 src/build_single.py

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright-core@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          export NODE_PATH="$PWD/node_modules"
          export CHROME_EXE="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          node tests/smoke_browser.js

      # 每日抓取 → 重新发布 → 用户打开自动补新岗位，这条链路靠 smoke_site.js 兜底：
      # 站点打开时会把快照里「本机还没有」的岗位增量合并进 localStorage，
      # 必须保证既补得上、又不冲掉用户已有数据、重复刷新不翻倍。
      - name: Build standalone site
        run: |
          python3 src/build_site.py
          python3 src/build_public.py

      - name: Site snapshot sync smoke test
        run: |
          export NODE_PATH="$PWD/node_modules"
          export CHROME_EXE="$(node -e 'console.log(require(\"playwright-core\").chromium.executablePath())')"
          node tests/smoke_site.js

      # 公开版另跑一轮：同一份冒烟脚本按 SMOKE_MODE=public 切到 dist/public +
      # qc_ 命名空间，并额外验证「内置快照不含隐私表」「命名空间未串到 qz_」
      # 「首次打开二选一两条路径」。
      - name: Public bundle smoke test
        run: |
          export NODE_PATH="$PWD/node_modules"
          export CHROME_EXE="$(node -e 'console.log(require(\"playwright-core\").chromium.executablePath())')"
          SMOKE_MODE=public node tests/smoke_site.js
